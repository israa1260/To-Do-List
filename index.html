<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>

    <div class="todo-container">
        <h2>To-Do List</h2>

        <!-- Search -->
        <input type="text" id="search-input" placeholder="Search tasks..." class="search-box">

        <div class="input-container">
            <input type="text" id="new-task" placeholder="Add a new task">
            <input type="date" id="task-date">

            <select id="task-priority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <button id="add-btn">Add</button>
        </div>

        <div class="filter-container">
            <button class="filter-btn" id="all-btn">All</button>
            <button class="filter-btn" id="active-btn">Active</button>
            <button class="filter-btn" id="completed-btn">Completed</button>
            <button class="filter-btn" id="clear-completed-btn">Clear Completed</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
